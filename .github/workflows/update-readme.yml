name: Update README Timestamp

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-main
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update README timestamp
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Update timestamp
        shell: bash
        run: |
          set -euo pipefail
          timestamp="Last updated: $(date -u +"%Y-%m-%d %H:%M UTC")"

          if grep -q '^Last updated:' README.md; then
            sed -i "s|^Last updated:.*|$timestamp|" README.md
          else
            printf '\n%s\n' "$timestamp" >> README.md
          fi

      - name: Commit only when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brajesh Kumar"
          git config user.email "90491106+Brajesh31@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "README timestamp is already current."
            exit 0
          fi

          git commit -m "chore: update README timestamp"
          git push origin HEAD:main
