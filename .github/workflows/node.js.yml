name: Node.js CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/node.js.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test and build (Node.js 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        env:
          CI: true
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm test -- --watchAll=false

      - name: Create production build
        env:
          CI: true
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/index.html
          test -d build/static
